name: Build & Release Android APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Web Production Assets
        run: npm run build

      - name: Initialize Capacitor Android if needed
        run: |
          npx cap init S-DRACIN com.sdracin.app --web-dir dist || true
          npx cap add android || true
          npx cap sync android

      - name: Fix Android testOnly flag in gradle.properties
        run: |
          echo "android.injected.testOnly=false" >> android/gradle.properties

      - name: Make Gradle Executable & Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: S-DRACIN-v1.1.0-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.1.0
          name: "S-DRACIN v1.1.0 Release APK"
          body: |
            ## 🎬 S-DRACIN v1.1.0 Release APK
            
            - ✨ VIP Free Access Unlocked
            - 📌 Melolo & DramaBox API Provider Switcher
            - 🤖 DRACIN AI Assistant Recommendation Engine
            - 🎬 Reels Shorts Vertical Video Feed
            - ⚡ Fix Mode Pengembang / Developer Options Install issue (`testOnly=false`)
          files: |
            android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
